function renderWatchedRow(item) {

    return `

        <div class="movie">

            <div class="movie-name">

                ${
                    item.link
                    ?
                    `
                    <a
                        href="${escapeAttribute(item.link)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHtml(item.name)}
                    </a>
                    `
                    :
                    `
                    <span>
                        ${escapeHtml(item.name)}
                    </span>
                    `
                }

            </div>

            <div class="movie-event">
                ${escapeHtml(item.event)}
            </div>

            <div class="movie-date">
                ${escapeHtml(item.date)}
            </div>

        </div>

    `;

}


/* =====================================================
   ПРОСМОТРЕННЫЕ ФИЛЬМЫ
   ===================================================== */

function renderMovies(search = "") {

    const query =
        String(search)
            .toLowerCase()
            .trim();

    const filtered =
        movies.filter(movie =>
            movie.name
                .toLowerCase()
                .includes(query)
            ||
            movie.event
                .toLowerCase()
                .includes(query)
            ||
            movie.date
                .toLowerCase()
                .includes(query)
        );

    let html = `

        <h2 class="display-title">
            Просмотренные фильмы
        </h2>

        <div class="movie-tools">

            <input
                class="movie-search"
                id="movieSearch"
                type="text"
                placeholder="Поиск фильма..."
                value="${escapeHtml(search)}"
                oninput="filterMovies(this.value)"
            >

        </div>

        <div class="movie-count">
            Показано:
            ${filtered.length}
            из
            ${movies.length}
        </div>

        <div class="movies">
    `;

    if (!filtered.length) {

        html += `
            <div class="empty">
                Фильмы не найдены ♡
            </div>
        `;

    } else {

        filtered.forEach(movie => {
            html += renderWatchedRow(movie);
        });

    }

    html += `
        </div>
    `;

    document
        .getElementById("rouletteContent")
        .innerHTML = html;

    const input =
        document.getElementById("movieSearch");

    if (input) {

        input.focus();

        input.setSelectionRange(
            input.value.length,
            input.value.length
        );

    }

}

/* =====================================================
   ЗАЩИТА HTML
   ===================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ЗАЩИТА URL
   ===================================================== */

function escapeAttribute(value) {

    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}
